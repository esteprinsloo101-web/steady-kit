<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <title>Worksheet — Mood &amp; Journal | Steady Kit</title>
  <style>
    body{font-family:Georgia,serif;max-width:700px;margin:2rem auto;padding:0 1rem;color:#1e2a24;line-height:1.5}
    h1{font-size:1.4rem;color:#1f4d41}
    .fence{font-size:0.85rem;background:#f8eaea;padding:0.75rem;border:1px solid #e0b8b8;margin-bottom:1.25rem}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #d9d2c5;padding:0.55rem;vertical-align:top}
    .big{min-height:120px}
    @media print{body{margin:0}}
  </style>
</head>
<body>
  <div class="fence"><strong>Steady Kit</strong> — Not therapy / not diagnosis. Adults 18+. Crisis: SADAG 0800 567 567 · findahelpline.com</div>
  <h1>Worksheet 6 — Mood Check-In + Journal</h1>
  <table>
    <tr><th style="width:30%">Date / time</th><td></td></tr>
    <tr><th>Mood (1–5)</th><td>1  2  3  4  5 &nbsp; (circle)</td></tr>
    <tr><th>One-line note</th><td class="big"></td></tr>
    <tr><th>What helped a little?</th><td class="big"></td></tr>
    <tr><th>What can wait until tomorrow?</th><td class="big"></td></tr>
  </table>
</body>
</html>
